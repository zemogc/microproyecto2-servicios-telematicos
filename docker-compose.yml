services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: opscenter
      MYSQL_USER: opscenter
      MYSQL_PASSWORD: opscenter
    networks:
      - red-app

  app:
    build: ./webapp
    environment:
      MYSQL_HOST: db
      MYSQL_USER: opscenter
      MYSQL_PASSWORD: opscenter
      MYSQL_DB: opscenter
    depends_on:
      - db
    networks:
      - red-app

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - red-app

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    networks:
      - red-app

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node_exporter
    networks:
      - red-app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - red-app

networks:
  red-app:
